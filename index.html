<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lagos Life 🔞 - Live your Lagos story with real people</title>
  <meta name="description" content="Lagos Life - Live your Lagos story with real people. Login or create an account.">
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'><text y='32' font-size='32'>👑</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="page-container">
    <!-- Header Section -->
    <header class="brand-header">
      <div class="crown-icon-wrapper" aria-hidden="true">
        <!-- Exact Lagos Life Crown with Nigerian flag ribbon -->
        <svg class="crown-svg" viewBox="0 0 72 56" width="60" height="48" fill="none"
          xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FFDF6D" />
              <stop offset="50%" stop-color="#F5B938" />
              <stop offset="100%" stop-color="#DF9514" />
            </linearGradient>
            <linearGradient id="gemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#34D399" />
              <stop offset="100%" stop-color="#059669" />
            </linearGradient>
            <filter id="crownGlow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#D97706" flood-opacity="0.25" />
            </filter>
          </defs>

          <!-- Crown Body -->
          <g filter="url(#crownGlow)">
            <path d="M7 16L19 38H53L65 16L47 27L36 7L25 27L7 16Z" fill="url(#goldGrad)" stroke="#B47206"
              stroke-width="1.5" stroke-linejoin="round" />

            <!-- Jewel tips on points -->
            <circle cx="7" cy="15" r="3" fill="#FFE27A" stroke="#B47206" stroke-width="1" />
            <circle cx="65" cy="15" r="3" fill="#FFE27A" stroke="#B47206" stroke-width="1" />
            <circle cx="36" cy="6" r="3.5" fill="#FFE27A" stroke="#B47206" stroke-width="1" />

            <!-- Center Emerald Jewel -->
            <polygon points="36,18 41,25 36,32 31,25" fill="url(#gemGrad)" stroke="#047857" stroke-width="1" />
            <polygon points="36,19 39,25 36,26 33,25" fill="#6EE7B7" opacity="0.8" />

            <!-- Side accent dots -->
            <circle cx="21" cy="27" r="2" fill="#E89B13" />
            <circle cx="51" cy="27" r="2" fill="#E89B13" />
          </g>

          <!-- Nigerian Flag Crown Base Band -->
          <g>
            <rect x="18" y="38" width="36" height="8" rx="2" fill="#FFFFFF" stroke="#2D3748" stroke-width="1.2" />
            <!-- Left Green stripe -->
            <path d="M19 39H30V45H19C18.45 45 18 44.55 18 44V40C18 39.45 18.45 39 19 39Z" fill="#008751" />
            <!-- Middle White stripe is native rect background -->
            <!-- Right Green stripe -->
            <path d="M42 39H53C53.55 39 54 39.45 54 40V44C54 44.55 53.55 45 53 45H42V39Z" fill="#008751" />
            <!-- Outline / trim -->
            <rect x="18" y="38" width="36" height="8" rx="2" fill="none" stroke="#64748B" stroke-width="0.75" />
          </g>
        </svg>
      </div>

      <div class="brand-title-row">
        <h1 class="brand-name">Lagos Life</h1>
        <span class="age-badge" id="ageBadge">18+</span>
      </div>
      <p class="brand-tagline">Live your Lagos story with real people.</p>
    </header>

    <!-- Main Card -->
    <main class="auth-card" id="authCard">
      <!-- Log In Form -->
      <form class="auth-form active" id="formLogin" novalidate>
        <div class="form-group">
          <label for="loginUsername">Username or email</label>
          <div class="input-wrapper">
            <input type="text" id="loginUsername" name="username" placeholder="tolu_eko" autocomplete="username"
              required>
          </div>
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <div class="input-wrapper has-icon-right">
            <input type="password" id="loginPassword" name="password" placeholder="" autocomplete="current-password"
              required>
            <button type="button" class="toggle-password" aria-label="Toggle password visibility"
              data-target="loginPassword">
              <!-- Eye outline icon matching screenshot -->
              <svg class="eye-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div class="links-row">
          <a href="#forgot" class="auth-link" id="forgotPassLink">Forgot password?</a>
          <a href="#support" class="auth-link" id="cantGetInLink">Can't get in?</a>
        </div>

        <button type="submit" class="submit-btn" id="loginSubmitBtn">
          Log in
        </button>

        <p class="card-footer-text" id="footerText">Welcome back to Lagos.</p>
        
        <div class="view-records-wrapper">
          <a href="records.html" class="records-page-link" id="viewRecordsLink">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
            View Database Records
          </a>
        </div>
      </form>
    </main>

    <!-- Success / Notification Toast -->
    <div class="toast" id="toast" role="alert" aria-live="assertive"></div>
  </div>

  <script src="script.js"></script>
</body>

</html>
